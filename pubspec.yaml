name: skidoo_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  dio: ^5.3.3
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2

  # State Management - BLoC
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  bloc_concurrency: ^0.2.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.1.2
  saver_gallery: ^3.0.7
  crop_your_image: ^0.7.5

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  carousel_slider_plus: ^7.1.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  provider: ^6.1.2

  # Chat - WebSocket & Local DB
  web_socket_channel: ^3.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Security
  flutter_secure_storage: ^9.2.2
  flutter_jailbreak_detection: ^1.9.0
  cryptography: ^2.7.0

  # Storage & Utils
  path_provider: ^2.1.1
  url_launcher: ^6.3.1
  lecle_downloads_path_provider: ^0.0.2+8
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

  # Forms
  easy_autocomplete: ^1.6.0
  intl: ^0.20.2

  # Video
  video_player: ^2.9.1

  # Web
  webview_flutter: ^4.4.2

dependency_overrides:
  # url_launcher_ios 6.3.0 has a Swift bug (UIApplication Launcher conformance).
  url_launcher_ios: '>=6.3.1 <6.4.0'
  # win32 5.5.0 references UnmodifiableUint8ListView removed in Dart 3.3.
  win32: '>=5.7.0 <6.0.0'

  # ── Flutter v1 embedding removal (PluginRegistry.Registrar) ─────────────────
  # Flutter 3.10+ removed PluginRegistry.Registrar. The packages below pin to
  # old versions that still reference it; these overrides force clean versions.
  flutter_plugin_android_lifecycle: '>=2.0.34 <3.0.0'
  camera_android: '>=0.10.10+16 <0.11.0'
  path_provider_android: '>=2.3.1 <3.0.0'
  shared_preferences_android: '>=2.4.23 <3.0.0'
  url_launcher_android: '>=6.3.29 <7.0.0'
  # 3.16.6 is the latest 3.x patch; drops Registrar without requiring
  # a webview_flutter major-version bump.
  webview_flutter_android: '>=3.16.6 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/navbar_icons/

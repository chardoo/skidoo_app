<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Allow the user to zoom in/out (browser zoom + pinch), like any web app,
       and scale the layout to the device width on mobile web. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="skidoo_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>skidoo_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    No-cache safety net: this build ships without a service worker
    (--pwa-strategy=none), but earlier builds did register one. Unregister any
    existing service worker and wipe its CacheStorage on every load so returning
    visitors are never pinned to a stale app shell.
  -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    })();
  </script>

  <!--
    Screenshot deterrents (web) — DISABLED for now so testers can right-click
    to inspect elements. Re-enable to block the right-click "Save image as…"
    menu and image drag-out. Note: browsers expose NO API to block OS-level
    screenshots, so this was best-effort only.

    <script>
      (function () {
        // Block the right-click context menu (Save image as…).
        window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
        // Block image drag-out.
        window.addEventListener('dragstart', function (e) {
          if (e.target && e.target.tagName === 'IMG') e.preventDefault();
        }, true);
      })();
    </script>
  -->

  <!--
    iOS Safari and Android Chrome require a user gesture before audio can play.
    This snippet resumes (and immediately suspends) an AudioContext on the first
    touch, satisfying the browser's media-engagement requirement so that
    video.muted = false works reliably after the initial tap.
  -->
  <script>
    (function () {
      function unlockAudio() {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        // Resume then close — we only need the activation, not actual output.
        ctx.resume().then(function () { ctx.close(); }).catch(function () {});
        document.removeEventListener('touchstart', unlockAudio, true);
        document.removeEventListener('touchend',   unlockAudio, true);
        document.removeEventListener('pointerdown', unlockAudio, true);
      }
      document.addEventListener('touchstart',  unlockAudio, true);
      document.addEventListener('touchend',    unlockAudio, true);
      document.addEventListener('pointerdown', unlockAudio, true);
    })();
  </script>

  <!--
    Browser zoom passthrough (web) — Flutter installs wheel/keyboard listeners on
    its view and otherwise swallows the browser's native zoom gestures, so the
    page can't be zoomed even though the viewport meta above allows it. These
    capture-phase listeners run BEFORE Flutter and hand zoom back to the browser
    on every page:
      • Ctrl/⌘ + +/-/0  → keyboard zoom
      • Trackpad pinch / Ctrl + mouse-wheel → wheel zoom
    We stopImmediatePropagation (so Flutter never sees the event) but never call
    preventDefault, so the browser performs its native zoom.
  -->
  <script>
    (function () {
      // Trackpad pinch and Ctrl+wheel both arrive as a 'wheel' with ctrlKey set.
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.stopImmediatePropagation();
      }, { capture: true, passive: true });

      // Keyboard zoom: Ctrl (Win/Linux) or ⌘ (macOS) with +, =, -, _, or 0.
      var zoomKeys = ['+', '=', '-', '_', '0'];
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && zoomKeys.indexOf(e.key) !== -1) {
          e.stopImmediatePropagation();
        }
      }, true);
    })();
  </script>
</head>
<body>
  <!-- flutter_bootstrap.js is generated by `flutter build web` / `flutter run -d chrome`.
       It uses FlutterLoader.load (not the deprecated loadEntrypoint) and reads
       AssetManifest.bin instead of the old AssetManifest.json. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

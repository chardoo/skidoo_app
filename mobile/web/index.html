<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="skidoo_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>skidoo_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Screenshot deterrents (web). Browsers expose NO API to block OS-level
    screenshots, so this is best-effort only — it blocks the right-click
    "Save image as…" menu and image drag-out. Kept JS-only (no global CSS) so
    Flutter's canvas input/selection is unaffected. True screenshot prevention
    is not possible on the web. (Flutter also calls BrowserContextMenu.disable.)
  -->
  <script>
    (function () {
      // Block the right-click context menu (Save image as…) — covers the gap
      // before Flutter has booted and called BrowserContextMenu.disable.
      window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
      // Block image drag-out.
      window.addEventListener('dragstart', function (e) {
        if (e.target && e.target.tagName === 'IMG') e.preventDefault();
      }, true);
    })();
  </script>

  <!--
    iOS Safari and Android Chrome require a user gesture before audio can play.
    This snippet resumes (and immediately suspends) an AudioContext on the first
    touch, satisfying the browser's media-engagement requirement so that
    video.muted = false works reliably after the initial tap.
  -->
  <script>
    (function () {
      function unlockAudio() {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        // Resume then close — we only need the activation, not actual output.
        ctx.resume().then(function () { ctx.close(); }).catch(function () {});
        document.removeEventListener('touchstart', unlockAudio, true);
        document.removeEventListener('touchend',   unlockAudio, true);
        document.removeEventListener('pointerdown', unlockAudio, true);
      }
      document.addEventListener('touchstart',  unlockAudio, true);
      document.addEventListener('touchend',    unlockAudio, true);
      document.addEventListener('pointerdown', unlockAudio, true);
    })();
  </script>
</head>
<body>
  <!-- flutter_bootstrap.js is generated by `flutter build web` / `flutter run -d chrome`.
       It uses FlutterLoader.load (not the deprecated loadEntrypoint) and reads
       AssetManifest.bin instead of the old AssetManifest.json. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

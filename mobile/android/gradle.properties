org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fetch the barcode model from Play Services instead of bundling it.
#
# mobile_scanner ships `com.google.mlkit:barcode-scanning` by default, which
# puts libbarhopper_v3.so and ~900 KB of .tflite models in the APK — 14 MB
# across the three ABIs of a fat build, ~5 MB of what one device downloads,
# for a QR scanner used on two screens.
#
# Unbundled asks Play Services for the same model on demand. It is the trade
# already made for face detection (see the ML Kit dependency in
# app/build.gradle.kts and the `com.google.mlkit.vision.DEPENDENCIES` meta-data
# in AndroidManifest.xml), and the cost is the same: the very first scan on a
# device that has never fetched the model waits for a download.
dev.steenbakker.mobile_scanner.useUnbundled=true

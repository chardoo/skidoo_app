server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── No caching, anywhere ──────────────────────────────────────────────────
    # Every response is served fresh so a new deploy is picked up immediately —
    # no stale index.html, main.dart.js, assets or CanvasKit. This is deliberate:
    # Flutter web does NOT content-hash main.dart.js / canvaskit / assets (same
    # file names every build), so a long-lived cache would pin users to an old
    # build.
    #
    # The PWA service worker (which also caches the app shell in the browser) is
    # disabled at build time via `--pwa-strategy=none` (see Dockerfile), so there
    # is no client-side cache to go stale either.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Disable validators so browsers/proxies can't serve a 304 from a prior copy.
    etag off;
    if_modified_since off;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Never cache the HTML entry point ──────────────────────────────────────
    # index.html references content-hashed asset URLs that change every build.
    # If the browser caches this file, users never see the new build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Flutter bootstrap / service-worker — must always revalidate ───────────
    # flutter_service_worker.js contains a hash of every asset; if it's stale
    # the service worker won't notice that new assets were deployed.
    # flutter_bootstrap.js is regenerated on every build.
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── JSON manifests — small, frequently updated ────────────────────────────
    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── Content-hashed static assets — safe to cache forever ─────────────────
    # Flutter fingerprints every JS/CSS/image/font file name with a build hash,
    # so these URLs are unique per build and can be cached indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: jperg_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.1+63

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0

  # The platform's own HTTP stacks, for image delivery — see
  # core/cache/platform_http_client.dart.
  #
  # Dart's own `HttpClient` (dart:io, BoringSSL) speaks HTTP/1.1 only. These
  # two give **HTTP/3 over QUIC**: NSURLSession on iOS, Cronet on Android. The
  # win is not multiplexing — at three concurrent warms, keep-alive already
  # amortises connection setup — it is loss recovery. HTTP/1.1 over TCP stalls
  # the whole connection on a dropped packet; QUIC recovers per stream, which
  # is the difference between a photo arriving and a photo arriving eventually
  # on the mobile networks most of this app's readers are on.
  #
  # Scoped to the image cache on purpose. Both expose a `package:http` Client,
  # which `HttpFileService` takes directly, so no bridge is needed there — and
  # images are where throughput and loss actually matter. Dio keeps dart:io
  # (see the note in core/cache/platform_http_client.dart).
  #
  # Android depends on Google Play Services for Cronet by default, falling back
  # to dart:io where that is absent. `--dart-define=cronetHttpNoPlay=true`
  # switches to the embedded Cronet instead, at a few MB of download.
  cupertino_http: ^3.1.0
  cronet_http: ^1.10.0
  dio: ^5.3.3
  cross_file: ^0.3.4
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2

  # State Management - BLoC
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  bloc_concurrency: ^0.2.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.1.2
  saver_gallery: ^3.0.7
  crop_your_image: ^0.7.5

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  # Direct, not transitive: core/cache/jperg_image_cache.dart configures the
  # store cached_network_image writes into, which means importing this package
  # by name.
  flutter_cache_manager: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  # Decodes the ~28-character hash the server stores per photo into the blurred
  # stand-in a card paints before any image byte arrives — see
  # core/widgets/jperg_image.dart and main/app/services/derivatives.py.
  flutter_blurhash: ^0.9.1

  # Chat - WebSocket & Local DB
  web_socket_channel: ^3.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Security
  #
  # **10.x, deliberately not 11.** The session token lives here, and the two
  # majors are not interchangeable: 10 rewrote the Android backend off the
  # deprecated Jetpack Crypto library onto its own ciphers and *migrates
  # existing data* on first read (`migrateOnAlgorithmChange`, on by default).
  # 11 then removes everything 10 deprecated, and says so plainly — "any data
  # saved using deprecated algorithms will be unusable after this upgrade.
  # If you used a version prior to v10, upgrade to v10 first".
  #
  # This app was on 9.2.4 passing `encryptedSharedPreferences: true`, so a
  # straight jump to 11 would have made every Android user's stored token
  # unreadable: signed out, onboarding reset, on an update they did not ask
  # for. 11 also wants compileSdk 37.
  #
  # So: ship 10.x, let it migrate on devices, and only then consider 11.
  # Do not raise this constraint without that step having shipped.
  flutter_secure_storage: ^10.3.0
  flutter_jailbreak_detection: ^1.9.0
  # Blocks screenshots / screen recording on Android (FLAG_SECURE) and iOS
  # (secure overlay).
  #
  # Every App Store upload warns "Upload Symbols Failed — the archive did not
  # include a dSYM for ScreenPreventerKit.framework". Expected, and not
  # fixable here: this pod vendors a prebuilt ScreenPreventerKit.xcframework
  # that the author stripped of DWARF before publishing, so there is no debug
  # info on this machine to build a dSYM from. Only upstream can ship one.
  #
  # The upload itself succeeds. The framework keeps its symbol table, so
  # crashes inside it still show function names — only file and line numbers
  # are lost, in a 170KB overlay shim. Ignore the warning.
  screen_protector: ^1.5.2
  cryptography: ^2.7.0

  # Storage & Utils
  path_provider: ^2.1.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

  # Forms
  intl: ^0.20.2

  # Video — the platform's own player: AVPlayer (iOS), ExoPlayer (Android),
  # <video> (web). Replaced media_kit, whose bundled libmpv + FFmpeg cost
  # ~20 MB of the iOS download to decode formats the OS already handles.
  video_player: ^2.9.1

  # Audio — the feed's music layer, one player for the whole app (see
  # FeedMusicController). Streams a remote URL, seeks, loops and takes a
  # volume, which is the entire surface this uses. Not just_audio_background:
  # feed music is not something to keep playing on the lock screen.
  just_audio: ^0.9.42

  # QR / Barcode
  mobile_scanner: ^7.0.0

  # Web
  webview_flutter: ^4.4.2
  app_links: ^7.2.1

  # Push notifications. No web implementation — every call site is guarded by
  # kIsWeb in PushNotificationService, which is the only file that imports this.
  onesignal_flutter: ^5.3.4
  in_app_purchase: ^3.3.1
  # Direct, not transitive: core/purchase/ios_photo_purchase.dart reads the
  # order token back off a transaction, and the field it lives on belongs to
  # the StoreKit subtypes (SK2PurchaseDetails / AppStorePurchaseDetails) rather
  # than the platform-neutral PurchaseDetails.
  in_app_purchase_storekit: ^0.4.0

dependency_overrides:
  # url_launcher_ios 6.3.0 has a Swift bug (UIApplication Launcher conformance).
  url_launcher_ios: '>=6.3.1 <6.4.0'
  # win32 5.5.0 references UnmodifiableUint8ListView removed in Dart 3.3.
  # Capped at <6.0.0 — win32 6.x breaks flutter_secure_storage_windows,
  # path_provider_windows, and share_plus at their current versions.
  win32: '>=5.7.0 <6.0.0'
  # package_info_plus 10.x needs win32 ^6.0.0 which we can't use yet.
  # 8.1.3 is the last version compatible with win32 5.x.
  package_info_plus: '>=8.0.0 <9.0.0'
  # Held on the 4.1.x line: 4.2.0 moved to win32 ^6.0.1, which the cap above
  # forbids. An override does not *fail* on that mismatch, it silently hands
  # the package a win32 it cannot compile against — and this is not a Windows
  # problem. Flutter's generated dart_plugin_registrant.dart imports every
  # platform's Dart plugin class in one file regardless of build target, and
  # flutter_secure_storage_windows picks its FFI implementation off
  # `dart.library.ffi`, which is true on iOS. So win32 5.x + 4.2.x breaks the
  # *iOS release build* on Win32Result / toHRESULT / HLOCAL.
  # 4.1.0 wants win32 ^5.5.4 and satisfies flutter_secure_storage's ^4.1.0.
  # Lifting this means win32 6.x, which drags share_plus to 13.x (breaking:
  # SharePlus.instance.share(ShareParams(...))) and package_info_plus to 10.x.
  flutter_secure_storage_windows: '>=4.1.0 <4.2.0'

  # ── Flutter v1 embedding removal (PluginRegistry.Registrar) ─────────────────
  # Flutter 3.10+ removed PluginRegistry.Registrar. The packages below pin to
  # old versions that still reference it; these overrides force clean versions.
  flutter_plugin_android_lifecycle: '>=2.0.34 <3.0.0'
  camera_android: '>=0.10.10+16 <0.11.0'
  path_provider_android: '>=2.3.1 <3.0.0'
  shared_preferences_android: '>=2.4.23 <3.0.0'
  url_launcher_android: '>=6.3.29 <7.0.0'
  # Was pinned to the last 3.x patch, which dropped the v1 embedding's
  # Registrar without needing the facade moved. That is no longer what it does.
  # webview_flutter 4.14 asks for webview_flutter_android ^4.12, and an
  # override silences the mismatch rather than resolving it — so the pin left
  # the Android WebView running an implementation three majors behind the Dart
  # calling it, on the two payment screens. Moved with the facade; 4.x needs
  # AGP 8 and Kotlin 1.9, and this project is on 8.11 and 2.2.
  webview_flutter_android: '>=4.12.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # Plugins resolve through CocoaPods, not Swift Package Manager.
  #
  # Flutter generates FlutterGeneratedPluginSwiftPackage with its own hardcoded
  # minimum platform (iOS 13.0 — see FlutterDarwinPlatform.deploymentTarget),
  # not this app's. screen_protector requires iOS 15.0, so under SPM the build
  # fails with "requires minimum platform version 15.0 ... but this target
  # supports 13.0" and there is no project-level knob to raise it.
  #
  # CocoaPods honours ios/Podfile, which pins 15.5 and re-applies it to every
  # pod in post_install, so the same plugins build cleanly there.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/ico/empty/
    - assets/ico/Arrow/
    - assets/ico/Calendar/
    - assets/ico/Communication/
    - assets/ico/Edit/
    - assets/ico/File/
    - assets/ico/Interface/
    - assets/ico/Menu/
    - assets/ico/Navigation/
    - assets/ico/System/
    - assets/ico/User/
    - assets/ico/Warning/
    - assets/navbar_icons/
    - assets/logo/
    - assets/splash/
    - assets/Images/

  # The two brand typefaces (see the brand guidelines, Typography): Syne for
  # headers, DM Sans for body. Both replace Poppins, which was never a brand
  # font. `Styles.displayFontFamily` / `Styles.bodyFontFamily` are the only
  # code that names them.
  #
  # Bundled rather than fetched by google_fonts at runtime. Without these files
  # the CDN download happens on first launch, so a cold/offline start renders
  # in Roboto/SF — different metrics, so layouts shift once the real font
  # lands.
  #
  # These are static instances cut from the upstream variable fonts
  # (fontTools.varLib.instancer), not the latin-subset statics Google's CSS API
  # hands out: those carry only 222 glyphs and drop Latin Extended-A, which
  # names in the app do use. DM Sans is pinned at `opsz` 14 — the optical size
  # Google's own static family uses — since Flutter does not drive that axis.
  #
  # Weights match what the app actually uses (see the fontWeight audit).
  # Syne's `wght` axis stops at 800, so it has no Black; nothing set in Syne
  # asks for w900. DM Sans Italic covers the five `FontStyle.italic` sites,
  # all at w400.
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
          weight: 400
        - asset: assets/fonts/Syne-Medium.ttf
          weight: 500
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

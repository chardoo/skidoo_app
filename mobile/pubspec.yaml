name: jperg_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  # Web Audio API interop for the new-message notification chime (web build).
  web: ^1.1.1
  http: ^1.1.0
  dio: ^5.3.3
  cross_file: ^0.3.4
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2

  # State Management - BLoC
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  bloc_concurrency: ^0.2.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.1.2
  saver_gallery: ^3.0.7
  crop_your_image: ^0.7.5

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  carousel_slider_plus: ^7.1.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  provider: ^6.1.2

  # Chat - WebSocket & Local DB
  web_socket_channel: ^3.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Security
  flutter_secure_storage: ^9.2.2
  flutter_jailbreak_detection: ^1.9.0
  # Blocks screenshots / screen recording on Android (FLAG_SECURE) and iOS
  # (secure overlay). No web support — web deterrents live in web/index.html.
  screen_protector: ^1.5.2
  cryptography: ^2.7.0

  # Storage & Utils
  path_provider: ^2.1.1
  url_launcher: ^6.3.1
  lecle_downloads_path_provider: ^0.0.2+8
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

  # Forms
  easy_autocomplete: ^1.6.0
  intl: ^0.20.2

  # Video — the platform's own player: AVPlayer (iOS), ExoPlayer (Android),
  # <video> (web). Replaced media_kit, whose bundled libmpv + FFmpeg cost
  # ~20 MB of the iOS download to decode formats the OS already handles.
  video_player: ^2.9.1

  # QR / Barcode
  mobile_scanner: ^7.0.0

  # Web
  webview_flutter: ^4.4.2
  app_links: ^7.2.1

  # Push notifications. No web implementation — every call site is guarded by
  # kIsWeb in PushNotificationService, which is the only file that imports this.
  onesignal_flutter: ^5.3.4

dependency_overrides:
  # url_launcher_ios 6.3.0 has a Swift bug (UIApplication Launcher conformance).
  url_launcher_ios: '>=6.3.1 <6.4.0'
  # win32 5.5.0 references UnmodifiableUint8ListView removed in Dart 3.3.
  # Capped at <6.0.0 — win32 6.x breaks flutter_secure_storage_windows,
  # path_provider_windows, and share_plus at their current versions.
  win32: '>=5.7.0 <6.0.0'
  # package_info_plus 10.x needs win32 ^6.0.0 which we can't use yet.
  # 8.1.3 is the last version compatible with win32 5.x.
  package_info_plus: '>=8.0.0 <9.0.0'

  # ── Flutter v1 embedding removal (PluginRegistry.Registrar) ─────────────────
  # Flutter 3.10+ removed PluginRegistry.Registrar. The packages below pin to
  # old versions that still reference it; these overrides force clean versions.
  flutter_plugin_android_lifecycle: '>=2.0.34 <3.0.0'
  camera_android: '>=0.10.10+16 <0.11.0'
  path_provider_android: '>=2.3.1 <3.0.0'
  shared_preferences_android: '>=2.4.23 <3.0.0'
  url_launcher_android: '>=6.3.29 <7.0.0'
  # 3.16.6 is the latest 3.x patch; drops Registrar without requiring
  # a webview_flutter major-version bump.
  webview_flutter_android: '>=3.16.6 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # Plugins resolve through CocoaPods, not Swift Package Manager.
  #
  # Flutter generates FlutterGeneratedPluginSwiftPackage with its own hardcoded
  # minimum platform (iOS 13.0 — see FlutterDarwinPlatform.deploymentTarget),
  # not this app's. screen_protector requires iOS 15.0, so under SPM the build
  # fails with "requires minimum platform version 15.0 ... but this target
  # supports 13.0" and there is no project-level knob to raise it.
  #
  # CocoaPods honours ios/Podfile, which pins 15.5 and re-applies it to every
  # pod in post_install, so the same plugins build cleanly there.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/navbar_icons/
    - assets/logo/
    - assets/splash/
    - assets/Images/

  # Poppins is bundled rather than fetched by google_fonts at runtime. Without
  # these files the CDN download happens on first launch, so a cold/offline
  # start renders in Roboto/SF — different metrics from Poppins, so layouts
  # shift once the real font lands. Weights match what the app actually uses
  # (see the fontWeight audit); Italic covers the two `FontStyle.italic` sites
  # in message_bubble.dart, both at w400.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
